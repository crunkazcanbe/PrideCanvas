<!doctype html>
<html><head><meta charset="utf-8"><title>Pride Browser</title>
<style>
:root{--bg:#160a2f;--panel:#24124a;--pink:#f5a9b8;--blue:#5bcefa;--white:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#3a1a6b,var(--bg) 60%);color:var(--white);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
.bar{width:100%;height:6px;background:linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#008026,#004dff,#750787,var(--blue),var(--pink),#fff)}
h1{margin:42px 0 6px;font-size:40px;letter-spacing:1px}
h1 span{background:linear-gradient(90deg,var(--blue),var(--pink),#fff,var(--pink),var(--blue));-webkit-background-clip:text;color:transparent}
p.sub{margin:0 0 26px;opacity:.75}
form{display:flex;width:min(640px,90vw);gap:8px}
input{flex:1;padding:13px 16px;border-radius:12px;border:2px solid var(--pink);background:#0d0620;color:#fff;font-size:17px;outline:none}
input:focus{border-color:var(--blue)}
button{padding:0 20px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--blue),var(--pink));color:#160a2f;font-weight:700;font-size:16px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;width:min(760px,92vw);margin:34px 0}
a.tile{display:block;padding:16px;border-radius:14px;background:var(--panel);border:1px solid #ffffff22;color:#fff;text-decoration:none;transition:transform .15s,border-color .15s}
a.tile:hover{transform:translateY(-3px);border-color:var(--pink)}
a.tile b{display:block;font-size:16px;margin-bottom:4px}
a.tile small{opacity:.65}
a.tile.ours{border-color:var(--blue);background:linear-gradient(135deg,#2b1660,#3d1b55)}
</style></head>
<body><div class="bar"></div>
<h1>🏳️‍⚧️ <span>Pride Browser</span></h1>
<p class="sub">Search the web or pick a place to go</p>
<form onsubmit="var q=document.getElementById('q').value.trim();if(!q)return false;location.href=(/^[a-z]+:\/\//i.test(q)?q:(!/\s/.test(q)&&/\./.test(q)?'https://'+q:'https://duckduckgo.com/?q='+encodeURIComponent(q)));return false;">
<input id="q" autofocus placeholder="Search or type a website…"><button>Go</button></form>
<div class="grid">
<a class="tile ours" href="https://pride.example.com"><b>🌈 Pride website</b><small>our site (coming soon)</small></a>
<a class="tile" href="https://minecraft.wiki"><b>📖 Minecraft Wiki</b><small>blocks, mobs, recipes</small></a>
<a class="tile" href="https://ftb.fandom.com/wiki/Feed_The_Beast_Wiki"><b>⚙️ FTB Wiki</b><small>modded guides</small></a>
<a class="tile" href="https://modrinth.com/mods?g=categories:forge&v=1.12.2"><b>🟢 Modrinth</b><small>1.12.2 Forge mods</small></a>
<a class="tile" href="https://www.curseforge.com/minecraft/search?class=mc-mods&gameVersion=1.12.2"><b>🔥 CurseForge</b><small>1.12.2 mods</small></a>
<a class="tile" href="https://www.youtube.com"><b>▶️ YouTube</b><small>videos & guides</small></a>
</div></body></html>
